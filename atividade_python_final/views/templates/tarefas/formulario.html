{% extends "base.html" %}
{% block title %}{{ 'Editar tarefa' if tarefa else 'Nova tarefa' }}{% endblock %}

{% block content %}
<h1>{{ 'Editar tarefa' if tarefa else 'Nova tarefa' }}</h1>

<form class="formulario" method="POST">
    <div class="form-grupo">
        <label for="titulo">Título</label>
        <input type="text" id="titulo" name="titulo" maxlength="60" required
               value="{{ tarefa.titulo if tarefa else '' }}">
    </div>

    <div class="form-grupo">
        <label for="descricao">Descrição</label>
        <textarea id="descricao" name="descricao" rows="4" maxlength="150" required>{{ tarefa.descricao if tarefa else '' }}</textarea>
    </div>

    <div class="form-grupo">
        <label for="status">Status</label>
        <select id="status" name="status" required>
            {% for opcao in ['Pendente', 'Em andamento', 'Concluida'] %}
            <option value="{{ opcao }}" {% if tarefa and tarefa.status == opcao %}selected{% endif %}>{{ opcao }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="form-grupo">
        <label for="usuario_id">Usuário responsável</label>
        <select id="usuario_id" name="usuario_id" required>
            <option value="">Selecione...</option>
            {% for usuario in usuarios %}
            <option value="{{ usuario.id }}"
                {% if tarefa and tarefa.usuario_id == usuario.id %}selected{% endif %}>
                {{ usuario.nome }}
            </option>
            {% endfor %}
        </select>
    </div>

    <button type="submit">Salvar</button>
</form>

<p><a href="{{ url_for('tarefa.index') }}">← Voltar</a></p>
{% endblock %}
